[package]
name = "limedaw"
version = "0.1.0"
edition = "2024"
description = "LimeDAW — a pattern-based digital audio workstation"
license = "GPL-3.0-or-later"
default-run = "limedaw"

[[bin]]
name = "limedaw"
path = "src/main.rs"

[lib]
name = "limedaw"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "canvas", "advanced", "lazy", "wgpu", "tiny-skia", "image", "svg", "web-colors",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustysynth = "1.3"
hound = "3"
anyhow = "1"
log = "0.4"
toml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", features = ["tokio", "linux-theme-detection", "wayland", "x11"] }
cpal = "0.18"
directories = "6"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "io-std"] }
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "Storage", "Navigator",
    "MediaQueryList", "Blob", "Url", "HtmlAnchorElement", "Clipboard",
    "AudioContext", "BaseAudioContext", "AudioNode", "AudioBuffer",
    "AudioDestinationNode", "ScriptProcessorNode", "AudioProcessingEvent",
    "AudioContextState", "Performance",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
toml = "0.9"
serde_json = "1"
