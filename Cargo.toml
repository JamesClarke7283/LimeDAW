[package]
name = "limedaw"
version = "0.1.0"
edition = "2024"
description = "LimeDAW — a pattern-based digital audio workstation"
license = "GPL-3.0-or-later"
homepage = "https://github.com/JamesClarke7283/LimeDAW"
repository = "https://github.com/JamesClarke7283/LimeDAW"
default-run = "limedaw"

[[bin]]
name = "limedaw"
path = "src/main.rs"

[lib]
name = "limedaw"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "canvas", "advanced", "lazy", "wgpu", "tiny-skia", "image", "svg", "web-colors",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustysynth = "1.3"
hound = "3"
anyhow = "1"
log = "0.4"
toml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", features = ["tokio", "linux-theme-detection", "wayland", "x11"] }
cpal = "0.18"
directories = "6"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "io-std"] }
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "Storage", "Navigator",
    "MediaQueryList", "Blob", "Url", "HtmlAnchorElement", "Clipboard",
    "AudioContext", "BaseAudioContext", "AudioNode", "AudioBuffer",
    "AudioDestinationNode", "ScriptProcessorNode", "AudioProcessingEvent",
    "AudioContextState", "Performance",
] }

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "James David Clarke <james@jamesdavidclarke.com>"
copyright = "2026, LimeDAW contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
A pattern-based digital audio workstation: channel rack, piano roll, playlist \
and mixer, with a built-in synthesiser, sampler and SoundFont playback, and an \
MCP server for driving the application programmatically."""
section = "sound"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0"
assets = [
    ["target/release/limedaw", "usr/bin/", "755"],
    ["assets/limedaw.desktop", "usr/share/applications/limedaw.desktop", "644"],
    ["assets/limedaw.svg", "usr/share/icons/hicolor/scalable/apps/limedaw.svg", "644"],
    ["assets/limedaw.png", "usr/share/icons/hicolor/256x256/apps/limedaw.png", "644"],
    ["README.md", "usr/share/doc/limedaw/README.md", "644"],
    ["packaging/linux/dev.limedaw.LimeDAW.metainfo.xml", "usr/share/metainfo/dev.limedaw.LimeDAW.metainfo.xml", "644"],
]

[package.metadata.generate-rpm]
license = "GPL-3.0-or-later"
summary = "A pattern-based digital audio workstation"
assets = [
    { source = "target/release/limedaw", dest = "/usr/bin/limedaw", mode = "755" },
    { source = "assets/limedaw.desktop", dest = "/usr/share/applications/limedaw.desktop", mode = "644" },
    { source = "assets/limedaw.svg", dest = "/usr/share/icons/hicolor/scalable/apps/limedaw.svg", mode = "644" },
    { source = "assets/limedaw.png", dest = "/usr/share/icons/hicolor/256x256/apps/limedaw.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/limedaw/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/limedaw/LICENSE", mode = "644" },
    { source = "packaging/linux/dev.limedaw.LimeDAW.metainfo.xml", dest = "/usr/share/metainfo/dev.limedaw.LimeDAW.metainfo.xml", mode = "644" },
]

# winit loads these at runtime, so automatic ELF dependency scanning misses them.
[package.metadata.generate-rpm.requires]
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
toml = "0.9"
serde_json = "1"
